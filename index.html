<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BOOKeeper</title>
  <link rel="icon" href="icon.png">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js" defer></script>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f8fb;
      --card: #ffffff;
      --surface: #f9fafb;
      --text: #1f2937;
      --muted: #6b7280;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --secondary: #059669;
      --border: #e5e7eb;
      --disabled: #d1d5db;
      --error: #b91c1c;
      --shadow: 0 18px 40px rgba(15, 23, 42, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: safe center;
      justify-content: center;
      background: var(--bg);
      font-family: Arial, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
      color: var(--text);
      padding: 24px;
    }

    .shell {
      width: min(860px, 100%);
      margin: 0 auto;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: var(--shadow);
      padding: 28px;
    }

    .app-header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 18px;
    }

    .app-icon {
      width: 64px;
      height: 64px;
      border-radius: 16px;
      object-fit: cover;
      flex-shrink: 0;
      background: #f3f4f6;
      border: 1px solid var(--border);
    }

    h1,
    h2,
    h3,
    p {
      margin: 0;
    }

    .app-title {
      font-size: 28px;
      font-weight: 700;
    }

    .tagline {
      margin-top: 4px;
      color: var(--muted);
      line-height: 1.5;
    }

    .version {
      margin: 0 0 22px 8px;
      font-size: 17px;
      color: var(--muted);
    }

    .options {
      display: grid;
      gap: 14px;
    }

    .option {
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px;
      background: var(--surface);
    }

    .option-header {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 8px;
    }

    .option h2 {
      font-size: 17px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      min-height: 26px;
      border-radius: 999px;
      padding: 4px 10px;
      background: #dbeafe;
      color: #1d4ed8;
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
    }

    .option p {
      color: var(--muted);
      line-height: 1.55;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 14px;
    }

    .document-actions {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-top: 30px;
      padding-left: 5px;
      padding-right: 5px;
    }

    .button {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      min-height: 42px;
      padding: 10px 15px;
      border-radius: 12px;
      border: 0;
      background: var(--primary);
      color: white;
      text-decoration: none;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .button:hover {
      background: var(--primary-hover);
    }

    .button.secondary {
      background: var(--secondary);
    }

    .button.back {
      background: #4b5563;
    }

    .button.back:hover {
      background: #374151;
    }

    .button.outline {
      background: white;
      color: var(--text);
      border: 1px solid var(--border);
    }

    .button.disabled {
      background: var(--disabled);
      color: #4b5563;
      cursor: not-allowed;
      pointer-events: none;
    }

    .notice {
      margin-top: 12px;
      color: var(--error);
      font-weight: 700;
    }

    .site-footer {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 16px;
      color: var(--muted);
      font-size: 14px;
    }

    .text-link {
      color: var(--primary);
      font-weight: 700;
      text-decoration: none;
    }

    .text-link:hover {
      text-decoration: underline;
    }

    .document-content {
      color: var(--text);
      line-height: 1.7;
    }

    .document-content h1 {
      font-size: 28px;
      margin: 0 0 18px;
    }

    .document-content h2 {
      font-size: 20px;
      margin: 26px 0 10px;
    }

    .document-content p,
    .document-content li {
      color: var(--text);
      line-height: 1.7;
    }

    .document-content p {
      margin: 0 0 12px;
    }

    .document-content ul {
      padding-left: 22px;
    }

    .document-content strong {
      color: #111827;
    }

    .modal-open .shell {
      filter: blur(4px);
      pointer-events: none;
      user-select: none;
    }

    .terms-modal {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: rgba(15, 23, 42, 0.28);
      backdrop-filter: blur(6px);
    }

    .terms-dialog {
      width: min(620px, 100%);
      max-height: min(760px, calc(100dvh - 48px));
      overflow: auto;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: var(--shadow);
      padding: 24px;
    }

    .terms-dialog h2 {
      font-size: 22px;
      margin: 0 0 10px;
    }

    .terms-dialog p {
      color: var(--muted);
      line-height: 1.6;
      margin: 0;
    }

    .terms-update-notice {
      margin-top: 12px;
      color: var(--error);
      font-weight: 700;
    }

    .terms-choice-actions,
    .terms-final-actions {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }

    .terms-choice-actions {
      margin-top: 18px;
    }

    .terms-final-actions {
      margin-top: 26px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
    }

    .terms-document {
      max-height: 260px;
      overflow: auto;
      margin-top: 16px;
      padding: 16px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--surface);
    }

    .terms-document h1 {
      font-size: 22px;
      margin: 0 0 14px;
    }

    .terms-document h2 {
      font-size: 18px;
      margin: 22px 0 8px;
    }

    .terms-document p,
    .terms-document li {
      color: var(--text);
      line-height: 1.65;
    }

    .terms-document p {
      margin: 0 0 10px;
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 520px) {
      body {
        padding: 16px;
      }

      .card {
        padding: 20px;
      }

      .button {
        width: 100%;
      }

      .document-actions {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <section class="card" id="installView">
      <div class="app-header">
        <img class="app-icon" src="icon.png" alt="BOOKeeper icon" />
        <div>
          <h1 class="app-title">BOOKeeper</h1>
          <p class="tagline">個人書籍購買紀錄、願望清單、歸類整理工具，讓書櫃不再雜亂。</p>
        </div>
      </div>

      <p class="version" id="versionText">正在讀取最新版本...</p>

      <section class="options" id="optionsSection"></section>

      <div class="document-actions">
        <a class="button" href="#privacy">隱私權政策</a>
        <a class="button" href="#terms">服務條款</a>
      </div>
    </section>

    <section class="card hidden" id="documentView">
      <div class="app-header">
        <img class="app-icon" src="icon.png" alt="BOOKeeper icon" />
        <div>
          <h1 class="app-title">BOOKeeper</h1>
          <p class="tagline" id="documentTitle">文件</p>
        </div>
      </div>
      <div class="actions" style="margin: 0 0 20px;">
        <a class="button back" href="./">↶ 返回安裝頁</a>
        <a class="button" href="#privacy">隱私權政策</a>
        <a class="button" href="#terms">服務條款</a>
      </div>
      <article class="document-content" id="documentContent">正在讀取文件...</article>
    </section>

    <footer class="site-footer">
      <span>BOOKeeper Updates</span>
      <span>
        <a class="text-link" href="#privacy">隱私權政策</a>
        <span aria-hidden="true"> / </span>
        <a class="text-link" href="#terms">服務條款</a>
      </span>
    </footer>
  </main>

  <div class="terms-modal hidden" id="termsConsentModal" role="dialog" aria-modal="true" aria-labelledby="termsConsentTitle">
    <section class="terms-dialog">
      <h2 id="termsConsentTitle">進入此網站，代表您同意以下條款</h2>
      <p>請先閱讀 BOOKeeper 的隱私權政策與服務條款。繼續使用本網站代表您同意這些條款。</p>
      <p class="terms-update-notice hidden" id="termsUpdateNotice">條款已有更新，請重新閱讀並同意後再繼續。</p>

      <div class="terms-choice-actions">
        <button class="button" type="button" id="showPrivacyInModal">隱私權政策</button>
        <button class="button" type="button" id="showTermsInModal">服務條款</button>
      </div>

      <article class="terms-document hidden" id="termsConsentDocument"></article>

      <div class="terms-final-actions">
        <a class="button back" href="https://www.google.com/">不同意並離開</a>
        <button class="button secondary" type="button" id="agreeTermsButton">同意並繼續</button>
      </div>
    </section>
  </div>

  <script>
    const TERMS_ACCEPTED_COOKIE = 'bookeeper_terms_accepted_at';
    const RELEASE_REPO = 'BOOKeeper-app/updates';
    const SIDESTORE_DOCS = 'https://docs.sidestore.io/';
    const LIVECONTAINER_DOCS = 'https://livecontainer.github.io/docs/intro';

    const state = {
      platform: detectPlatform(),
      version: '',
      buildVersion: '',
      ipaUrl: '',
      apkUrl: '',
      iosStoreUrl: '',
      androidStoreUrl: '',
      termsUpdate: '',
    };

    function detectPlatform() {
      const ua = navigator.userAgent || '';
      if (/android/i.test(ua)) return 'android';
      if (/iPhone|iPad|iPod/i.test(ua)) return 'ios';
      return 'unknown';
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function buttonLink(label, href, className = '') {
      return `<a class="button ${className}" href="${href}" target="_blank" rel="noopener noreferrer">${label}</a>`;
    }

    function disabledButton(label) {
      return `<span class="button disabled">${label}</span>`;
    }

    async function fetchJsonNoStore(path) {
      const separator = path.includes('?') ? '&' : '?';
      const response = await fetch(`${path}${separator}t=${Date.now()}`, { cache: 'no-store' });
      if (!response.ok) throw new Error(`Failed to load ${path}: ${response.status}`);

      return response.json();
    }

    async function loadReleaseAssets(version) {
      const url = `https://api.github.com/repos/${RELEASE_REPO}/releases/tags/v${encodeURIComponent(version)}`;

      try {
        const response = await fetch(url, { cache: 'no-store' });
        if (response.status === 404) return { ipaUrl: '', apkUrl: '' };
        if (!response.ok) throw new Error(`GitHub release lookup failed: ${response.status}`);

        const release = await response.json();
        const assets = Array.isArray(release.assets) ? release.assets : [];
        const ipa = assets.find((asset) => asset.name === `BOOKeeper-${version}.ipa`)
          || assets.find((asset) => asset.name.endsWith('.ipa'));
        const apk = assets.find((asset) => asset.name === `BOOKeeper-${version}.apk`)
          || assets.find((asset) => asset.name.endsWith('.apk'));

        return {
          ipaUrl: ipa?.browser_download_url || '',
          apkUrl: apk?.browser_download_url || '',
        };
      } catch (error) {
        console.error(error);
        return { ipaUrl: '', apkUrl: '' };
      }
    }

    function renderInstallChoice() {
      document.getElementById('optionsSection').innerHTML = `
        <article class="option">
          <div class="option-header">
            <h2>iOS Sideload 安裝</h2>
            <span class="badge">IPA</span>
          </div>
          <p>iOS 版需透過 Sideload 工具安裝。<br />請先依照 SideStore 或 LiveContainer 官方文件完成設定，再下載 IPA 安裝。</p>
          <div class="actions">
            ${buttonLink('SideStore 官方說明', SIDESTORE_DOCS, 'outline')}
            ${buttonLink('LiveContainer 官方說明', LIVECONTAINER_DOCS, 'outline')}
            ${getIosInstallActions()}
          </div>
          ${getIosUnavailableText()}
        </article>
        <article class="option">
          <div class="option-header">
            <h2>Android APK 安裝</h2>
            <span class="badge">Native build</span>
          </div>
          <p>下載 APK 後，依照 Android 系統提示允許此來源安裝，即可完成 BOOKeeper 安裝或更新。</p>
          <div class="actions">${getAndroidInstallActions()}</div>
          ${getAndroidUnavailableText()}
        </article>
      `;
    }

    function getIosInstallActions() {
      return state.iosStoreUrl
        ? buttonLink('前往商店安裝', state.iosStoreUrl, 'secondary')
        : state.ipaUrl
          ? buttonLink('下載 IPA', state.ipaUrl, 'secondary')
          : disabledButton('尚無可下載版本');
    }

    function getIosUnavailableText() {
      return state.iosStoreUrl || state.ipaUrl
        ? ''
        : '<p class="notice">這個版本目前沒有可下載的 IPA。</p>';
    }

    function renderIos() {
      document.getElementById('optionsSection').innerHTML = `
        <article class="option">
          <div class="option-header">
            <h2>iOS Sideload 安裝</h2>
            <span class="badge">IPA</span>
          </div>
          <p>iOS 版需透過 Sideload 工具安裝。<br />請先依照 SideStore 或 LiveContainer 官方文件完成設定，再下載 IPA 安裝。</p>
          <div class="actions">
            ${buttonLink('SideStore 官方說明', SIDESTORE_DOCS, 'outline')}
            ${buttonLink('LiveContainer 官方說明', LIVECONTAINER_DOCS, 'outline')}
            ${getIosInstallActions()}
          </div>
          ${getIosUnavailableText()}
        </article>
      `;
    }

    function getAndroidInstallActions() {
      return state.androidStoreUrl
        ? buttonLink('前往商店安裝', state.androidStoreUrl, 'secondary')
        : state.apkUrl
          ? buttonLink('下載 APK', state.apkUrl, 'secondary')
          : disabledButton('尚無可下載版本');
    }

    function getAndroidUnavailableText() {
      return state.androidStoreUrl || state.apkUrl
        ? ''
        : '<p class="notice">這個版本目前沒有可下載的 APK。</p>';
    }

    function renderAndroid() {
      document.getElementById('optionsSection').innerHTML = `
        <article class="option">
          <div class="option-header">
            <h2>Android APK 安裝</h2>
            <span class="badge">APK</span>
          </div>
          <p>下載 APK 後，依照 Android 系統提示允許此來源安裝，即可完成 BOOKeeper 安裝或更新。</p>
          <div class="actions">${getAndroidInstallActions()}</div>
          ${getAndroidUnavailableText()}
        </article>
      `;
    }

    async function loadBuildInfo() {
      const data = await fetchJsonNoStore('./latest_build');
      state.buildVersion = data.version || '';
      state.ipaUrl = data.ios_link || '';
      state.apkUrl = data.android_link || '';
      state.iosStoreUrl = data.ios_store_link || '';
      state.androidStoreUrl = data.android_store_link || '';
    }

    async function loadTermsUpdateInfo() {
      try {
        const data = await fetchJsonNoStore('./latest_version');
        state.termsUpdate = data['terms-update'] || '';
      } catch (error) {
        console.error(error);
        state.termsUpdate = '';
      }
    }

    async function loadFallbackBuildAssets(version) {
      if (!version || (state.ipaUrl && state.apkUrl)) return;

      const releaseAssets = await loadReleaseAssets(version);
      if (!state.ipaUrl) state.ipaUrl = releaseAssets.ipaUrl;
      if (!state.apkUrl) state.apkUrl = releaseAssets.apkUrl;
    }

    async function loadVersionInfo() {
      const versionText = document.getElementById('versionText');

      try {
        await loadBuildInfo();
        state.version = state.buildVersion || 'unknown';
        versionText.textContent = `目前版本：${state.version}`;

        await loadFallbackBuildAssets(state.buildVersion);

        if (state.platform === 'ios') {
          renderIos();
        } else if (state.platform === 'android') {
          renderAndroid();
        } else {
          renderInstallChoice();
        }
      } catch (error) {
        versionText.textContent = '無法讀取最新版本。';
        document.getElementById('optionsSection').innerHTML = `
          <article class="option">
            <h2>讀取更新資訊失敗</h2>
            <p>請稍後再試一次，或確認網路連線是否正常。</p>
          </article>
        `;
        console.error(error);
      }
    }

    const documents = {
      '#privacy': {
        title: '隱私權政策',
        path: './privacy-policy.md',
      },
      '#terms': {
        title: '服務條款',
        path: './terms-of-service.md',
      },
    };

    function getCookie(name) {
      const prefix = `${name}=`;
      return document.cookie
        .split(';')
        .map((item) => item.trim())
        .find((item) => item.startsWith(prefix))
        ?.slice(prefix.length) || '';
    }

    function setCookie(name, value) {
      const oneYear = 60 * 60 * 24 * 365;
      document.cookie = `${name}=${encodeURIComponent(value)}; Max-Age=${oneYear}; Path=/; SameSite=Lax`;
    }

    function parseTime(value) {
      const time = Date.parse(decodeURIComponent(value || ''));
      return Number.isFinite(time) ? time : 0;
    }

    function shouldShowTermsConsent() {
      const acceptedAt = parseTime(getCookie(TERMS_ACCEPTED_COOKIE));
      const termsUpdatedAt = parseTime(state.termsUpdate);
      return !acceptedAt || (termsUpdatedAt && acceptedAt < termsUpdatedAt);
    }

    function openTermsConsentModal(isUpdated) {
      document.body.classList.add('modal-open');
      document.getElementById('termsUpdateNotice').classList.toggle('hidden', !isUpdated);
      document.getElementById('termsConsentModal').classList.remove('hidden');
    }

    function closeTermsConsentModal() {
      document.body.classList.remove('modal-open');
      document.getElementById('termsConsentModal').classList.add('hidden');
    }

    async function renderConsentDocument(documentConfig) {
      const content = document.getElementById('termsConsentDocument');
      content.classList.remove('hidden');
      content.textContent = `正在讀取${documentConfig.title}...`;

      try {
        const response = await fetch(`${documentConfig.path}?t=${Date.now()}`, { cache: 'no-store' });
        if (!response.ok) throw new Error(`Failed to load ${documentConfig.path}: ${response.status}`);

        const markdown = await response.text();
        if (window.marked?.parse) {
          content.innerHTML = window.marked.parse(markdown);
        } else {
          content.innerHTML = `<pre>${escapeHtml(markdown)}</pre>`;
        }
      } catch (error) {
        content.innerHTML = `<p class="notice">無法讀取${documentConfig.title}，請稍後再試。</p>`;
        console.error(error);
      }
    }

    async function initTermsConsent() {
      await loadTermsUpdateInfo();
      const termsUpdatedAt = parseTime(state.termsUpdate);
      const acceptedAt = parseTime(getCookie(TERMS_ACCEPTED_COOKIE));

      if (shouldShowTermsConsent()) {
        openTermsConsentModal(Boolean(acceptedAt && termsUpdatedAt && acceptedAt < termsUpdatedAt));
      }
    }

    async function renderDocument(documentConfig) {
      const content = document.getElementById('documentContent');
      document.getElementById('documentTitle').textContent = documentConfig.title;
      content.textContent = `正在讀取${documentConfig.title}...`;

      try {
        const response = await fetch(`${documentConfig.path}?t=${Date.now()}`, { cache: 'no-store' });
        if (!response.ok) throw new Error(`Failed to load ${documentConfig.path}: ${response.status}`);

        const markdown = await response.text();
        if (window.marked?.parse) {
          content.innerHTML = window.marked.parse(markdown);
        } else {
          content.innerHTML = `<pre>${escapeHtml(markdown)}</pre>`;
        }
      } catch (error) {
        content.innerHTML = `<p class="notice">無法讀取${documentConfig.title}，請稍後再試。</p>`;
        console.error(error);
      }
    }

    function syncView() {
      const documentConfig = documents[window.location.hash];
      const isDocument = Boolean(documentConfig);
      document.getElementById('installView').classList.toggle('hidden', isDocument);
      document.getElementById('documentView').classList.toggle('hidden', !isDocument);
      if (documentConfig) renderDocument(documentConfig);
    }

    window.addEventListener('hashchange', syncView);
    document.getElementById('showPrivacyInModal')?.addEventListener('click', () => {
      renderConsentDocument(documents['#privacy']);
    });
    document.getElementById('showTermsInModal')?.addEventListener('click', () => {
      renderConsentDocument(documents['#terms']);
    });
    document.getElementById('agreeTermsButton')?.addEventListener('click', () => {
      setCookie(TERMS_ACCEPTED_COOKIE, new Date().toISOString());
      closeTermsConsentModal();
    });
    loadVersionInfo();
    initTermsConsent();
    syncView();
  </script>
</body>
</html>
